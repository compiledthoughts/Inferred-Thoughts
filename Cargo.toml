[package]
name = "inferred-thoughts"
version = "0.8.2"
edition = "2024"

[lib]
name = "inferred_thoughts"
path = "src/lib.rs"

[[bin]]
name = "inferred"
path = "src/main.rs"

[dependencies]
memmap2 = "0.9"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rayon = "1"
# For the OpenAI-compatible server only. Hand-rolling JSON was considered and
# rejected: parsing arbitrary client payloads means unicode escapes, nested
# content arrays and unknown fields, which is where a hand-rolled parser breaks
# against a real UI rather than against a test.
serde = { version = "1", features = ["derive"] }
# `preserve_order`: a tool's JSON reaches the prompt through the template's
# `tojson`, and the model was trained on its keys in the order the client wrote
# them. Sorted keys would be a different prompt.
serde_json = { version = "1", features = ["preserve_order"] }
# The model's own chat template, rendered as written rather than re-implemented.
# minijinja is Jinja by Jinja's author; `pycompat` supplies the Python string
# methods the Qwen templates call (`startswith`, `split`, `rstrip`, ...).
minijinja = { version = "2", features = ["preserve_order", "loop_controls"] }
minijinja-contrib = { version = "2", features = ["pycompat"] }

[features]
# Off by default so the crate builds and tests without a CUDA toolkit.
# CLAUDE.md scopes the project to NVIDIA + sm_120; this gate is about keeping
# `cargo test` usable, not about portability.
cuda = []
