<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>inferredThoughts</title>
<style>
  :root {
    --bg: #12100e; --panel: #1a1714; --line: #2b2622; --ink: #efe9e2;
    --dim: #a79c90; --accent: #d8873f; --user: #21303a; --err: #e06c5a;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #faf7f3; --panel: #fff; --line: #e6ded4; --ink: #1c1917;
      --dim: #6b6157; --accent: #b96a22; --user: #e7eef3; --err: #b3402c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.55 ui-sans-serif,
    system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
  }
  header {
    display: flex; align-items: baseline; gap: 12px; padding: 10px 16px;
    border-bottom: 1px solid var(--line); background: var(--panel);
  }
  header b { font-weight: 650; letter-spacing: .2px; }
  header .model { color: var(--dim); font-size: 13px; }
  header .spacer { flex: 1; }
  header .stat { color: var(--dim); font-size: 12.5px; font-variant-numeric: tabular-nums; }
  #log { flex: 1; overflow-y: auto; padding: 18px 16px 8px; }
  .wrap { max-width: 760px; margin: 0 auto; }
  .turn { margin: 0 0 18px; }
  .who { font-size: 12px; color: var(--dim); margin-bottom: 4px; }
  .bubble {
    white-space: pre-wrap; word-wrap: break-word; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--panel);
  }
  .turn.user .bubble { background: var(--user); }
  details.think {
    margin: 0 0 8px; border: 1px dashed var(--line); border-radius: 10px;
    background: transparent;
  }
  details.think > summary {
    cursor: pointer; padding: 7px 12px; color: var(--dim); font-size: 13px;
    list-style: none;
  }
  details.think > summary::-webkit-details-marker { display: none; }
  details.think > summary::before { content: "▸ "; }
  details.think[open] > summary::before { content: "▾ "; }
  details.think .body {
    white-space: pre-wrap; padding: 0 12px 10px; color: var(--dim); font-size: 13.5px;
  }
  .meta { font-size: 12px; color: var(--dim); margin-top: 5px; font-variant-numeric: tabular-nums; }
  .err { color: var(--err); }
  footer { border-top: 1px solid var(--line); background: var(--panel); padding: 10px 16px 14px; }
  form { display: flex; gap: 8px; max-width: 760px; margin: 0 auto; align-items: flex-end; }
  textarea {
    flex: 1; resize: none; min-height: 44px; max-height: 40vh; padding: 10px 12px;
    color: var(--ink); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; font: inherit;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 10px 16px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--accent); color: #17130f; font: inherit; font-weight: 600;
    cursor: pointer; min-height: 44px;
  }
  button.ghost { background: transparent; color: var(--dim); font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  .hint { max-width: 760px; margin: 6px auto 0; font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<header>
  <b>inferredThoughts</b>
  <span class="model" id="model">connecting…</span>
  <span class="spacer"></span>
  <span class="stat" id="stat"></span>
  <button class="ghost" id="clear" type="button" title="Start a new conversation">new</button>
</header>

<div id="log"><div class="wrap" id="wrap"></div></div>

<footer>
  <form id="form">
    <textarea id="input" placeholder="Ask something…  (Enter to send, Shift+Enter for a new line)" autofocus></textarea>
    <button id="send" type="submit">Send</button>
    <button class="ghost" id="stop" type="button" hidden>Stop</button>
  </form>
  <div class="hint" id="hint"></div>
</footer>

<script>
// The whole client. It talks to this same server's /v1/chat/completions, which
// streams `reasoning_content` before `content` — the two are shown apart, the
// reasoning folded away, because a reasoning model spends most of its tokens
// there and almost none of it is what you asked for.
const $ = (id) => document.getElementById(id);
const wrap = $("wrap"), log = $("log");
const messages = [];          // what we send back: user and assistant turns only
let controller = null;        // aborts the in-flight request

const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 80;
const scroll = (force) => { if (force || atBottom()) log.scrollTop = log.scrollHeight; };

function turn(who) {
  const el = document.createElement("div");
  el.className = "turn " + who;
  el.innerHTML = `<div class="who">${who === "user" ? "you" : "assistant"}</div>`;
  wrap.appendChild(el);
  return el;
}

function bubble(el, text) {
  const b = document.createElement("div");
  b.className = "bubble";
  b.textContent = text;
  el.appendChild(b);
  return b;
}

function thinkBlock(el) {
  const d = document.createElement("details");
  d.className = "think";
  d.innerHTML = `<summary>thinking…</summary><div class="body"></div>`;
  el.appendChild(d);
  return d;
}

async function models() {
  try {
    const r = await fetch("v1/models");
    const j = await r.json();
    $("model").textContent = j.data?.[0]?.id ?? "unknown model";
  } catch {
    $("model").textContent = "server not reachable";
  }
}

async function send(text) {
  messages.push({ role: "user", content: text });
  bubble(turn("user"), text);
  scroll(true);

  const el = turn("assistant");
  let think = null, thinkBody = null, answer = null, answerText = "", thinkText = "";
  const meta = document.createElement("div");
  meta.className = "meta";
  meta.textContent = "…";
  el.appendChild(meta);
  const started = performance.now();
  let firstToken = 0, pieces = 0;

  controller = new AbortController();
  $("send").disabled = true;
  $("stop").hidden = false;

  try {
    const res = await fetch("v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages, stream: true, max_tokens: 2048 }),
      signal: controller.signal,
    });
    if (!res.ok) throw new Error(`server said ${res.status}`);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      // SSE frames are separated by a blank line; a frame can arrive in pieces.
      let cut;
      while ((cut = buf.indexOf("\n\n")) !== -1) {
        const frame = buf.slice(0, cut).trim();
        buf = buf.slice(cut + 2);
        if (!frame.startsWith("data:")) continue;
        const payload = frame.slice(5).trim();
        if (payload === "[DONE]") continue;
        let d;
        try { d = JSON.parse(payload).choices[0].delta; } catch { continue; }
        if (!firstToken) firstToken = performance.now();
        if (d.reasoning_content) {
          if (!think) { think = thinkBlock(el); thinkBody = think.querySelector(".body"); }
          thinkText += d.reasoning_content;
          thinkBody.textContent = thinkText;
          pieces++;
          scroll();
        }
        if (d.content) {
          if (think && think.open) think.open = false;
          if (!answer) answer = bubble(el, "");
          answerText += d.content;
          answer.textContent = answerText;
          pieces++;
          scroll();
        }
      }
    }
    if (think) {
      const words = thinkText.trim().split(/\s+/).filter(Boolean).length;
      think.querySelector("summary").textContent = `thought for ${words} words`;
    }
    if (!answer) bubble(el, "(no answer — the model produced only reasoning)");
    messages.push({ role: "assistant", content: answerText });

    const secs = (performance.now() - (firstToken || started)) / 1000;
    const rate = secs > 0 ? (pieces / secs).toFixed(1) : "—";
    const wait = ((firstToken || performance.now()) - started) / 1000;
    meta.textContent = `${rate} pieces/s · first token after ${wait.toFixed(1)}s`;
    $("stat").textContent = `${rate} pieces/s`;
  } catch (e) {
    meta.className = "meta err";
    meta.textContent = e.name === "AbortError" ? "stopped" : `error: ${e.message}`;
    if (e.name === "AbortError" && answerText) {
      messages.push({ role: "assistant", content: answerText });
    } else if (e.name !== "AbortError") {
      messages.pop();   // the turn never happened; do not resend it as history
    }
  } finally {
    controller = null;
    $("send").disabled = false;
    $("stop").hidden = true;
    $("input").focus();
    scroll();
  }
}

$("form").addEventListener("submit", (e) => {
  e.preventDefault();
  const t = $("input").value.trim();
  if (!t || controller) return;
  $("input").value = "";
  $("input").style.height = "auto";
  send(t);
});
$("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); }
});
$("input").addEventListener("input", function () {
  this.style.height = "auto";
  this.style.height = Math.min(this.scrollHeight, window.innerHeight * 0.4) + "px";
});
$("stop").addEventListener("click", () => controller && controller.abort());
$("clear").addEventListener("click", () => {
  if (controller) controller.abort();
  messages.length = 0;
  wrap.innerHTML = "";
  $("stat").textContent = "";
  $("input").focus();
});

$("hint").textContent = "Served by the engine itself — no proxy, no build step.";
models();
</script>
</body>
</html>
